name: guard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No problem data, personal data or identifiers in the repo
        run: python3 scripts/guard.py --all
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests (invented problems only)
        run: node tests/render.test.js
