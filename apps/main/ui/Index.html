<script>
var TOKEN = <?= token ?>;
var ME0 = JSON.parse(<?= meJson ?>);
function call(method, args) {
  return new Promise(function (ok, fail) {
    google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { alertBox(e.message || e); fail(e); }).api(TOKEN, method, args || {});
  });
}
function alertBox(msg) { var d = document.createElement('div'); d.className = 'err'; d.textContent = msg; document.body.prepend(d); setTimeout(function () { d.remove(); }, 8000); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function escA(s) { return esc(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }   // trong thuộc tính HTML
function typeset(el) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]); else setTimeout(function () { typeset(el); }, 300); }

var ME;
function showMe(me) {
  ME = me;
  document.getElementById('me').textContent = me.email + ' · ' + me.eff.join(', ');
  var gr = document.getElementById('go-rounds');
  gr.hidden = !me.eff.some(function (r) { return ['TBT', 'PT', 'NCB', 'Quản trị'].indexOf(r) >= 0; });
  gr.onclick = function () { if (dirtyEdit()) { alertBox('Đang sửa dở — bấm Lưu hoặc Huỷ trước khi rời trang.'); return; } nav({ v: 'rounds' }); openRounds(); };
}
Promise.resolve(ME0).then(function (me) {
  showMe(me);
  if (me.roles.indexOf('Quản trị') >= 0) {
    var s = document.getElementById('view-as'); s.hidden = false;
    ['TBT', 'PT', 'NCB', 'PB', 'VP', 'BTK'].forEach(function (r) { var o = document.createElement('option'); o.value = r; o.textContent = 'Xem như ' + r; s.appendChild(o); });
    // Không tải lại trang: trang chạy trong khung cách ly của Google, location.reload() làm trang trắng.
    s.onchange = function () {
      call('viewAs', { role: s.value }).then(function () { return call('me'); }).then(function (m) { showMe(m); PCACHE = {}; LIST_Y = 0; loadList(); });
    };
  }
  loadList();
});

// Nút Quay lại / Tiến của trình duyệt: dùng lịch sử của Apps Script (trang chạy trong khung của Google).
// Không có phần này, nút Quay lại rời khỏi hệ thống, về trang "Xin chào".
// Đo thời gian (chỉ hiện cho Quản trị, góc dưới trang) — để biết chậm ở đâu.
function timing(what, t0) {
  var ms = Date.now() - t0; console.log('[đo] ' + what + ': ' + ms + ' ms');
  if (!ME || ME.roles.indexOf('Quản trị') < 0) return;
  var el = document.getElementById('timing');
  if (!el) { el = document.createElement('div'); el.id = 'timing'; el.style.cssText = 'position:fixed;right:8px;bottom:6px;font:11px system-ui;color:#888;background:#fff8;padding:2px 6px'; document.body.appendChild(el); }
  el.textContent = what + ': ' + (ms / 1000).toFixed(1) + ' s';
}
function nav(state) { try { google.script.history.push(state, {}, state.ma || ''); } catch (e) {} }
try {
  google.script.history.replace({}, {}, '');
  google.script.history.setChangeHandler(function (e) {
    var ma = e && e.state && e.state.ma;
    if (dirtyEdit()) { var cur = document.getElementById('page').dataset.ma; nav({ ma: cur }); alertBox('Đang sửa dở — bấm Lưu hoặc Huỷ trước khi rời trang.'); return; }
    if (ma) openProblem(ma); else if (e && e.state && e.state.v === 'rounds') openRounds(); else showList();
  });
} catch (e) {}
['f-topic', 'f-level', 'f-status'].forEach(function (id) { document.getElementById(id).onchange = function () { LIST_Y = 0; renderList(); }; });

// Danh sách: tải mọi bài MỘT lần, lọc ngay trên trình duyệt; mở bài rồi quay lại thì danh sách vẫn nguyên (không tải lại).
var ALL = null, LIST_Y = 0;
function loadList() {
  var L = document.getElementById('list');
  L.innerHTML = '<p class="mut">Đang tải…</p>'; showList();
  var t0 = Date.now();
  call('bundle', {}).then(function (b) {
    ALL = (b && b.rows) || []; LROWS = {}; ALL.forEach(function (p) { LROWS[p.ma_bai] = p; });
    PCACHE = (b && b.details) || {};
    timing('tải danh sách + ' + ALL.length + ' bài', t0);
    renderList();
  });
}
function showList() {
  document.getElementById('page').hidden = true; document.getElementById('rounds').hidden = true; document.getElementById('list').hidden = false;
  window.scrollTo(0, LIST_Y);
}
function renderList() {
  var L = document.getElementById('list'), t = val('f-topic'), m = val('f-level'), st = val('f-status');
  var rows = (ALL || []).filter(function (p) { return (!t || p.chu_de === t) && (!m || p.muc === m) && (!st || p.trang_thai === st); });
  L.innerHTML = rows.length ? '' : '<p class="mut">Không có bài nào.</p>';
  rows.forEach(function (p) {
    var c = document.createElement('article'); c.className = 'card';
    var r = PiRender.render(p.de_bai || '');
    c.innerHTML = '<div class="head"><a href="#" class="code">' + esc(p.ma_bai) + '</a>' + chip(p.chu_de) + chip(p.muc && 'Mức ' + p.muc) +
      chip(p.trang_thai) + (p.checks ? '<span class="chip w">cần kiểm tra ' + p.checks + '</span>' : '') +
      (p.conflicts ? '<span class="chip w">xung đột mở ' + p.conflicts + '</span>' : '') + giaoChip(p.giao) + '<span class="au">' + esc(p.tac_gia) + '</span></div>' +
      '<div class="tx">' + r.html + '</div>';
    c.querySelector('.code').onclick = function (e) { e.preventDefault(); LIST_Y = window.scrollY; nav({ ma: p.ma_bai }); openProblem(p.ma_bai); };
    L.appendChild(c);
  });
  typeset(L);
}
function val(id) { return document.getElementById(id).value; }
function vnDate(d) { var m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : String(d || ''); }
/** Chip cho phản biện: hạn, đã có phiếu, đã xong. */
function giaoChip(g) {
  if (!g) return '';
  return g.xong ? '<span class="chip ok">đã xong</span>' : '<span class="chip w">' + (g.han ? 'hạn ' + esc(vnDate(g.han)) : 'chưa có hạn') + (g.phieu ? ' · đã có phiếu' : ' · chưa có phiếu') + '</span>';
}
function chip(t) { return t ? '<span class="chip">' + esc(t) + '</span>' : ''; }

// Bộ nhớ tạm phía trình duyệt: mở lại bài / danh sách hiện ngay, rồi cập nhật khi máy chủ trả lời.
var PCACHE = {}, LCACHE = {}, LROWS = {};
function openProblem(ma) {
  var P = document.getElementById('page'); document.getElementById('list').hidden = true; document.getElementById('rounds').hidden = true; P.hidden = false;
  window.scrollTo(0, 0);
  if (PCACHE[ma]) renderProblem(ma, PCACHE[ma], false);
  else if (LROWS[ma]) renderProblem(ma, { problem: LROWS[ma], comments: [], limited: true, partial: true }, true);
  else P.innerHTML = '<p class="mut">Đang tải…</p>';
  var t0 = Date.now();
  call('getProblem', { ma_bai: ma }).then(function (d) {
    timing('làm mới ' + ma, t0);
    if (d && d.problem) { delete d.problem.de_bai_goc; delete d.problem.loi_giai_goc; }
    if (!d) { alertBox('Không tải được bài ' + ma + '. Hãy thử lại.'); return; }
    var same = PCACHE[ma] && JSON.stringify(PCACHE[ma]) === JSON.stringify(d);
    PCACHE[ma] = d;
    if (!same && !P.hidden && P.dataset.ma === ma && !busyTyping()) renderProblem(ma, d, false);
  });
}
function renderProblem(ma, d, loading) {
  var P = document.getElementById('page'); P.dataset.ma = ma;
  var p = d.problem, de = PiRender.render(p.de_bai || ''), lg = p.loi_giai ? PiRender.render(p.loi_giai) : null;
  var warn = de.warnings.concat(lg ? lg.warnings : []);
  var ed = d.canEdit && !loading;
  var btn = function (f) { return ed ? ' <button class="sm" data-edit="' + f + '">Sửa</button>' : ''; };
  P.innerHTML = '<p><a href="#" id="back">← Danh sách</a></p>' +
    '<div class="head"><span class="code">' + esc(p.ma_bai) + '</span>' + chip(p.chu_de) + chip(p.muc && 'Mức ' + p.muc) + chip(p.trang_thai) +
    '<span class="au">' + esc(d.author ? d.author.ten_in + (d.author.don_vi ? ' (' + d.author.don_vi + ')' : '') : (p.tac_gia || '')) + '</span></div>' +
    (d.can && d.can.status && !loading ? '<p class="sm-t">Trạng thái: <select id="st-sel">' + d.lists.statuses.map(function (x) {
      return '<option' + (x === p.trang_thai ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') +
      '</select> <button class="sm" data-act="status">Đổi trạng thái</button></p>' : '') +
    (ed ? '<p class="mut sm-t" id="ver">Phiên bản ' + esc(p.phien_ban || 0) + (p.nguoi_cap_nhat ? ' · sửa lần cuối: ' + esc(p.nguoi_cap_nhat) + ', ' + esc(p.cap_nhat) : '') + '</p>' : '') +
    '<div id="sec-de_bai"><h3>Đề bài' + btn('de_bai') + '</h3><div class="tx">' + de.html + '</div></div>' +
    (loading ? '<p class="mut">Đang tải lời giải và thảo luận…</p>' :
    '<div id="sec-loi_giai">' + (lg ? '<h3>Lời giải' + btn('loi_giai') + '</h3><div class="tx">' + lg.html + '</div>'
                                    : '<h3>Lời giải' + btn('loi_giai') + '</h3><p class="mut">(không có lời giải)</p>') + '</div>' +
    (warn.length ? '<p class="w">Cảnh báo hiển thị: ' + esc(warn.join('; ')) + '</p>' : '') +
    (d.limited ? '' : '<details id="props"' + (PROPS_OPEN ? ' open' : '') + '><summary>Nguồn &amp; chỉnh sửa</summary>' + props(d) + '</details>') +
    (d.mine || []).map(reviewForm).join('') + (d.reviews ? reviewsList(d.reviews) : '') +
    '<h3>Thảo luận</h3><div id="cm">' + d.comments.map(function (c) { return '<div class="cm"><b>' + esc(c.ai || c.email) + '</b> <span class="mut">' + esc(c.ngay) + '</span><div>' + PiRender.render(c.noi_dung).html + '</div></div>'; }).join('') + '</div>' +
    '<textarea id="cm-new" rows="4" placeholder="Nhận xét (có thể viết công thức $…$)"></textarea><button id="cm-send">Gửi nhận xét</button>');
  document.getElementById('back').onclick = function (e) {
    e.preventDefault();
    if (dirtyEdit()) { alertBox('Đang sửa dở — bấm Lưu hoặc Huỷ trước khi rời trang.'); return; }
    nav({}); showList();
  };
  EDITORS = {};
  P.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { openEditor(ma, b.getAttribute('data-edit')); }; });
  var hb = document.getElementById('hist-load');
  if (hb) hb.onclick = function () { loadHistory(ma); };
  var pd = document.getElementById('props');
  if (pd) pd.ontoggle = function () { PROPS_OPEN = pd.open; };
  P.onclick = function (ev) { var b = ev.target.closest('[data-act]'); if (b && !b.disabled) act(ma, b); };
  P.querySelectorAll('.rv textarea').forEach(function (ta) {
    var pv = ta.parentNode.querySelector('.rv-pv'), tm = null;
    ta.oninput = function () { clearTimeout(tm); tm = setTimeout(function () { pv.innerHTML = PiRender.render(ta.value).html; typeset(pv); }, 400); };
  });
  var send = document.getElementById('cm-send');
  if (send) send.onclick = function () {
    var t = document.getElementById('cm-new').value.trim(); if (!t) return;
    send.disabled = true; send.textContent = 'Đang gửi…';
    call('addComment', { ma_bai: ma, noi_dung: t }).then(function () { delete PCACHE[ma]; openProblem(ma); },
                                                       function () { send.disabled = false; send.textContent = 'Gửi nhận xét'; });
  };
  typeset(P);
}
function list(a, f) { return a && a.length ? '<ul>' + a.map(function (x) { return '<li>' + f(x) + '</li>'; }).join('') + '</ul>' : '<p class="mut">—</p>'; }
var PROPS_OPEN = false;
function props(d) {
  var v = d.provenance || {}, can = d.can || {}, L = d.lists || {};
  var opts = function (list, cur, skip) {
    return list.filter(function (x) { return !skip || skip.indexOf(x) < 0 || x === cur; })
      .map(function (x) { return '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');
  };
  var corr = function (c) {
    return '<b>' + esc(c.vi_tri) + '</b>: ' + esc(c.truoc) + ' → ' + esc(c.sau) + ' (' + esc(c.ly_do) + '; ' +
      (can.props ? '<select class="inl-sel" data-act="corr" data-id="' + escA(c.id) + '">' + opts(L.correctionStatuses.indexOf(c.trang_thai) < 0 && c.trang_thai ? [c.trang_thai].concat(L.correctionStatuses) : L.correctionStatuses, c.trang_thai) + '</select>'
                 : esc(c.trang_thai)) + ')';
  };
  var check = function (c) {
    var open = c.trang_thai !== 'xong';
    return esc(c.noi_dung) + ' <span class="' + (open ? 'w' : 'mut') + '">[' + esc(c.trang_thai) + ']</span>' +
      (c.ket_qua ? '<div class="mut">⇒ ' + esc(c.ket_qua) + '</div>' : '') +
      (!can.props ? '' : open ? ' <button class="sm" data-act="check-close" data-id="' + escA(c.id) + '">Đóng…</button>'
                              : ' <button class="sm" data-act="check-reopen" data-id="' + escA(c.id) + '">Mở lại</button>') +
      '<div class="inl" data-for="' + escA(c.id) + '"></div>';
  };
  var confl = function (c) {
    var tbtOnly = (L.tbtConflicts || []).indexOf(c.loai) >= 0;
    return '<b>' + esc(c.loai) + '</b> — ' + esc(c.mo_ta) + (c.cach_giai_quyet ? ' ⇒ ' + esc(c.cach_giai_quyet) : '') +
      ' <span class="' + (c.trang_thai === 'đã giải quyết' ? 'mut' : 'w') + '">[' + esc(c.trang_thai) + ']</span>' +
      (tbtOnly ? ' <span class="mut">(TBT quyết định)</span>' : '') +
      (can.props ? ' <button class="sm" data-act="confl-edit" data-id="' + escA(c.id) + '" data-tbt="' + (tbtOnly ? 1 : 0) + '">Ghi quyết định…</button>' : '') +
      '<div class="inl" data-for="' + escA(c.id) + '"></div>';
  };
  return '<div class="props"><h4>Nguồn</h4><p>' + esc([v.thu_muc, v.tep_goc, v.ngay_nhan, v.kenh].filter(Boolean).join(' · ')) + '</p>' +
    '<h4>Đối chiếu nguyên bản</h4><p>' + esc(v.doi_chieu || 'chưa') + '</p>' +
    '<h4>Sửa đổi</h4>' + list(d.corrections, corr) +
    '<h4>Cần kiểm tra</h4>' + list(d.checks, check) +
    (can.props ? '<button class="sm" data-act="check-new">+ Thêm mục cần kiểm tra</button><div class="inl" data-for="check-new"></div>' : '') +
    '<h4>Xung đột</h4>' + list(d.conflicts, confl) +
    (can.props ? '<button class="sm" data-act="confl-new">+ Thêm xung đột</button><div class="inl" data-for="confl-new"></div>' : '') +
    '<h4>Nhật ký chuyển đổi</h4>' + list(d.log, function (l) { return esc(l.noi_dung); }) +
    '<h4>Lịch sử sửa đề / lời giải</h4><div id="hist"><button class="sm" id="hist-load">Xem lịch sử</button></div></div>';
}

/* ---------- Thao tác trên trang bài: trạng thái, mục cần kiểm tra, xung đột, sửa đổi ---------- */
function inlBox(id) { return document.querySelector('.inl[data-for="' + id + '"]'); }
/** Ô nhập nhỏ ngay dưới mục: fields = [{k, label, type:'text'|'area'|'select', opts, val}], gửi bằng send(values). */
function inlineForm(id, fields, okLabel, send) {
  var box = inlBox(id); if (!box) return;
  if (box.innerHTML) { box.innerHTML = ''; return; }                   // bấm lần nữa thì đóng
  box.innerHTML = fields.map(function (f, i) {
    var el = f.type === 'select' ? '<select data-k="' + f.k + '">' + f.opts.map(function (o) { return '<option' + (o === f.val ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>'
           : f.type === 'area' ? '<textarea rows="2" data-k="' + f.k + '"></textarea>' : '<input type="text" data-k="' + f.k + '">';
    return '<label>' + esc(f.label) + ' ' + el + '</label>';
  }).join('') + '<button class="pri sm" data-k="ok">' + esc(okLabel) + '</button> <button class="sm" data-k="no">Huỷ</button>';
  fields.forEach(function (f) { if (f.type !== 'select' && f.val) box.querySelector('[data-k="' + f.k + '"]').value = f.val; });
  var first = box.querySelector('textarea,input'); if (first) first.focus();
  box.querySelector('[data-k=no]').onclick = function () { box.innerHTML = ''; };
  var ok = box.querySelector('[data-k=ok]');
  ok.onclick = function () {
    var v = {}; box.querySelectorAll('[data-k]').forEach(function (e) { if (e.tagName !== 'BUTTON') v[e.getAttribute('data-k')] = e.value.trim(); });
    ok.disabled = true;
    send(v).then(function () { box.innerHTML = ''; }, function () { ok.disabled = false; });
  };
}
/** Sau mỗi thao tác: lấy lại bài từ máy chủ, cập nhật chấm trên danh sách, vẽ lại (giữ mục Nguồn & chỉnh sửa đang mở). */
function refresh(ma) {
  return call('getProblem', { ma_bai: ma }).then(function (d) {
    if (!d || !d.problem) return;
    delete d.problem.de_bai_goc; delete d.problem.loi_giai_goc;
    PCACHE[ma] = d;
    var r = LROWS[ma];
    if (r) {
      r.trang_thai = d.problem.trang_thai;
      r.checks = d.checks.filter(function (c) { return c.trang_thai !== 'xong'; }).length;
      var g = (d.mine || [])[0];
      if (g) r.giao = { ky: g.ky, ma_bai: g.ma_bai, han: g.han, xong: g.xong, phieu: !!g.review };
      r.conflicts = d.conflicts.filter(function (c) { return String(c.trang_thai).indexOf('mở') >= 0 || String(c.trang_thai).indexOf('chờ') >= 0; }).length;
    }
    if (ALL) renderList();
    var P = document.getElementById('page');
    if (!P.hidden && P.dataset.ma === ma && !dirtyEdit()) renderProblem(ma, d, false);
  });
}
function act(ma, b) {
  var a = b.getAttribute('data-act'), id = b.getAttribute('data-id'), d = PCACHE[ma], L = (d && d.lists) || {};
  var done = function (p) { return p.then(function () { return refresh(ma); }); };
  if (a === 'rv-save' || a === 'rv-done' || a === 'rv-undo') {
    var box = b.closest('.rv'), ky = box.getAttribute('data-ky'), stl = box.querySelector('.st');
    var go = function (p, msg) {
      b.disabled = true; stl.textContent = 'Đang lưu…';
      p.then(function () { return refresh(ma); }).then(function () { var s2 = document.querySelector('.rv[data-ky="' + ky + '"] .st'); if (s2) s2.textContent = msg; },
                                                      function () { b.disabled = false; stl.textContent = ''; });
    };
    if (a === 'rv-save') {
      var rec = box.querySelector('input[type=radio]:checked');
      if (!rec) { stl.textContent = 'Hãy chọn đề nghị.'; return; }
      go(call('submitReview', { ky: ky, ma_bai: ma, muc_de_nghi: box.querySelector('select').value, diem: rec.value, nhan_xet: box.querySelector('textarea').value }), 'Đã lưu phiếu.');
    } else go(call('markDone', { ky: ky, ma_bai: ma, xong: a === 'rv-done' }), a === 'rv-done' ? 'Đã đánh dấu xong.' : 'Đã bỏ đánh dấu xong.');
    return;
  }
  if (a === 'status') {
    var st = document.getElementById('st-sel').value;
    if (st === d.problem.trang_thai) return;
    b.disabled = true;
    done(call('setStatus', { ma_bai: ma, trang_thai: st })).then(null, function () { b.disabled = false; });
  } else if (a === 'check-new') {
    inlineForm('check-new', [{ k: 'noi_dung', label: 'Cần kiểm tra gì', type: 'area' }], 'Thêm', function (v) {
      return done(call('addCheck', { ma_bai: ma, noi_dung: v.noi_dung }));
    });
  } else if (a === 'check-close') {
    inlineForm(id, [{ k: 'ket_qua', label: 'Kết quả (đã kiểm tra thế nào, ai xác nhận)', type: 'area' }], 'Đóng mục', function (v) {
      return done(call('closeCheck', { id: id, ket_qua: v.ket_qua, trang_thai: 'xong' }));
    });
  } else if (a === 'check-reopen') {
    b.disabled = true;
    done(call('closeCheck', { id: id, trang_thai: 'mở' })).then(null, function () { b.disabled = false; });
  } else if (a === 'confl-new') {
    inlineForm('confl-new', [{ k: 'loai', label: 'Loại', type: 'select', opts: L.conflictTypes }, { k: 'mo_ta', label: 'Mô tả', type: 'area' }], 'Thêm', function (v) {
      return done(call('addConflict', { ma_bai: ma, loai: v.loai, mo_ta: v.mo_ta }));
    });
  } else if (a === 'confl-edit') {
    var c = d.conflicts.filter(function (x) { return x.id === id; })[0] || {};
    var tbtOnly = b.getAttribute('data-tbt') === '1' && !(d.can && d.can.tbt);
    var sts = L.conflictStatuses.filter(function (x) { return !tbtOnly || x !== 'đã giải quyết'; });
    inlineForm(id, [{ k: 'trang_thai', label: 'Trạng thái', type: 'select', opts: sts, val: tbtOnly ? 'chờ TBT' : 'đã giải quyết' },
                    { k: 'cach_giai_quyet', label: tbtOnly ? 'Ghi chú cho TBT (không bắt buộc)' : 'Cách giải quyết', type: 'area', val: c.cach_giai_quyet }],
      'Lưu', function (v) { return done(call('resolveConflict', { id: id, trang_thai: v.trang_thai, cach_giai_quyet: v.cach_giai_quyet })); });
  }
}
/* thay đổi ở ô chọn trạng thái sửa đổi: gửi ngay */
document.addEventListener('change', function (ev) {
  var s = ev.target.closest && ev.target.closest('select[data-act=corr]'); if (!s) return;
  var ma = document.getElementById('page').dataset.ma; s.disabled = true;
  call('setCorrectionStatus', { id: s.getAttribute('data-id'), trang_thai: s.value }).then(function () { return refresh(ma); }, function () { s.disabled = false; });

/* ---------- Sửa đề / lời giải (NCB, PT, Quản trị) ----------
 * Khoá lạc quan: gửi kèm phiên bản đang xem; nếu người khác vừa lưu, máy chủ từ chối, bản đang gõ vẫn giữ trong ô,
 * bản mới nhất hiện bên dưới để người sửa tự gộp rồi lưu lại. Không bao giờ ghi đè lặng lẽ. */
var EDITORS = {};
var FIELD_NAME = { de_bai: 'đề bài', loi_giai: 'lời giải' };
function dirtyEdit() { return Object.keys(EDITORS).some(function (f) { var e = EDITORS[f]; return e && e.ta.value !== e.orig; }); }
function busyTyping() {
  var c = document.getElementById('cm-new');
  return Object.keys(EDITORS).length > 0 || !!(c && c.value.trim()) || !!document.querySelector('.inl textarea, .inl input') ||
    Array.prototype.some.call(document.querySelectorAll('.rv textarea'), function (t) { return t.value !== t.defaultValue; });
}
function openEditor(ma, field) {
  var d = PCACHE[ma]; if (!d || EDITORS[field]) return;
  var sec = document.getElementById('sec-' + field), orig = d.problem[field] == null ? '' : String(d.problem[field]);
  sec.innerHTML = '<h3>Sửa ' + FIELD_NAME[field] + ' <span class="mut">(LaTeX sạch — ghi chú, lý do sửa ghi ở mục Sửa đổi / Cần kiểm tra, không ghi vào văn bản)</span></h3>' +
    '<div class="ed"><textarea class="src" spellcheck="false"></textarea><div class="pv tx"></div></div>' +
    '<div class="kind"><label><input type="radio" name="k-' + field + '" value="nho" checked> <b>Sửa nhỏ</b> — chính tả, định dạng, bổ sung dữ liệu thiếu (chỉ ghi lịch sử)</label>' +
    '<label><input type="radio" name="k-' + field + '" value="noi_dung"> <b>Sửa nội dung toán</b> — công thức, đáp số, lập luận (ghi vào Sửa đổi, chờ tác giả xác nhận)</label>' +
    '<div class="kfields" hidden><label>Vị trí <input type="text" data-f="vi_tri" placeholder="ví dụ: dòng 3; kết luận"></label>' +
    '<label>Lý do <input type="text" data-f="ly_do" placeholder="ví dụ: bước trước tính ra 2/3, kết luận chép nhầm"></label></div></div>' +
    '<div class="edbar"><button class="pri" data-a="save">Lưu</button> <button data-a="cancel">Huỷ</button> <span class="st mut"></span></div><div class="newer"></div>';
  var ta = sec.querySelector('textarea'), pv = sec.querySelector('.pv'), st = sec.querySelector('.st');
  ta.value = orig; ta.rows = Math.min(24, Math.max(8, orig.split('\n').length + 2));
  var e = EDITORS[field] = { ta: ta, orig: orig, base: d.problem.phien_ban, cancelArmed: false };
  var kf = sec.querySelector('.kfields'), kind = function () { return sec.querySelector('input[type=radio]:checked').value; };
  sec.querySelectorAll('input[type=radio]').forEach(function (r) { r.onchange = function () { kf.hidden = kind() !== 'noi_dung'; }; });
  var timer = null, draw = function () {
    var r = PiRender.render(ta.value);
    pv.innerHTML = r.html + (r.warnings.length ? '<p class="w">Cảnh báo hiển thị: ' + esc(r.warnings.join('; ')) + '</p>' : '');
    typeset(pv);
  };
  ta.oninput = function () { e.cancelArmed = false; st.textContent = ''; clearTimeout(timer); timer = setTimeout(draw, 400); };
  draw(); ta.focus();
  sec.querySelector('[data-a=cancel]').onclick = function () {
    if (ta.value !== e.orig && !e.cancelArmed) { e.cancelArmed = true; st.textContent = 'Có thay đổi chưa lưu — bấm Huỷ lần nữa để bỏ.'; return; }
    delete EDITORS[field]; closeEditor(ma, field);
  };
  var save = sec.querySelector('[data-a=save]');
  save.onclick = function () {
    var k = kind(), viTri = sec.querySelector('[data-f=vi_tri]').value.trim(), lyDo = sec.querySelector('[data-f=ly_do]').value.trim();
    if (k === 'noi_dung' && (!viTri || !lyDo)) { st.textContent = 'Sửa nội dung toán: cần ghi Vị trí và Lý do.'; return; }
    save.disabled = true; st.textContent = 'Đang lưu…'; clearTimeout(timer); draw();
    var text = ta.value;
    call('saveText', { ma_bai: ma, truong: field, noi_dung: text, phien_ban: e.base, loai: k, vi_tri: viTri, ly_do: lyDo }).then(function (r) {
      var cur = PCACHE[ma];
      cur.problem[field] = text; cur.problem.phien_ban = r.phien_ban;
      if (!r.khong_doi) { cur.problem.cap_nhat = r.cap_nhat; cur.problem.nguoi_cap_nhat = r.nguoi_cap_nhat; }
      if (field === 'de_bai' && LROWS[ma]) LROWS[ma].de_bai = text;
      if (EDITORS.de_bai && field !== 'de_bai') EDITORS.de_bai.base = r.phien_ban;      // phiên bản chung cho cả bài
      if (EDITORS.loi_giai && field !== 'loi_giai') EDITORS.loi_giai.base = r.phien_ban;
      delete EDITORS[field]; closeEditor(ma, field);
      if (r.khong_doi) alertBox('Không có thay đổi nào — không tạo phiên bản mới.');
      if (r.sua_doi) refresh(ma);                                          // dòng Sửa đổi mới
      if (ALL) renderList();
    }, function (err) {
      save.disabled = false; st.textContent = '';
      if (String(err && err.message || err).indexOf('người khác sửa') < 0) return;
      // người khác vừa lưu: lấy bản mới nhất, giữ bản đang gõ, để người sửa tự gộp
      call('getProblem', { ma_bai: ma }).then(function (nd) {
        if (!nd || !nd.problem) return;
        delete nd.problem.de_bai_goc; delete nd.problem.loi_giai_goc;
        PCACHE[ma] = nd; e.base = nd.problem.phien_ban; e.cancelArmed = false;
        var newer = nd.problem[field] == null ? '' : String(nd.problem[field]);
        sec.querySelector('.newer').innerHTML = '<div class="conf"><p><b>' + esc(nd.problem.nguoi_cap_nhat || 'Người khác') + '</b> vừa lưu phiên bản ' +
          esc(nd.problem.phien_ban) + '. Bản bạn đang gõ vẫn còn trong ô ở trên. So với bản mới nhất dưới đây, chép phần cần giữ vào ô rồi bấm Lưu lần nữa ' +
          '(lần lưu sau sẽ thay bản mới nhất này).</p>' + diffHtml(newer, ta.value) +
          '<details><summary>Bản mới nhất (mã LaTeX)</summary><pre></pre></details></div>';
        sec.querySelector('.newer pre').textContent = newer;
        st.textContent = 'Đã lấy bản mới nhất (phiên bản ' + nd.problem.phien_ban + ').';
        var v = document.getElementById('ver');
        if (v) v.textContent = 'Phiên bản ' + nd.problem.phien_ban + (nd.problem.nguoi_cap_nhat ? ' · sửa lần cuối: ' + nd.problem.nguoi_cap_nhat + ', ' + nd.problem.cap_nhat : '');
        draw();
      });
    });
  };
}

/** Đóng một ô sửa: vẽ lại riêng phần đó (ô sửa kia, nếu đang mở, giữ nguyên) và dòng phiên bản. */
function closeEditor(ma, field) {
  var p = PCACHE[ma].problem, sec = document.getElementById('sec-' + field), t = p[field] ? PiRender.render(p[field]) : null;
  sec.innerHTML = '<h3>' + (field === 'de_bai' ? 'Đề bài' : 'Lời giải') + ' <button class="sm" data-edit="' + field + '">Sửa</button></h3>' +
    (t ? '<div class="tx">' + t.html + '</div>' + (t.warnings.length ? '<p class="w">Cảnh báo hiển thị: ' + esc(t.warnings.join('; ')) + '</p>' : '')
       : '<p class="mut">(không có ' + FIELD_NAME[field] + ')</p>');
  sec.querySelector('[data-edit]').onclick = function () { openEditor(ma, field); };
  var v = document.getElementById('ver');
  if (v) v.textContent = 'Phiên bản ' + (p.phien_ban || 0) + (p.nguoi_cap_nhat ? ' · sửa lần cuối: ' + p.nguoi_cap_nhat + ', ' + p.cap_nhat : '');
  typeset(sec);
}

/* ---------- Phiếu phản biện (trên trang bài) ---------- */

      '<b>' + esc(v.diem || '') + '</b> <span class="mut">' + esc(v.ngay) + '</span><div>' + PiRender.render(String(v.nhan_xet || '')).html + '</div></div>';

/* ---------- Trang Kỳ phản biện (PT, Quản trị quản lý; TBT, NCB xem) ---------- */
var RV = null;
function openRounds() {
  var R = document.getElementById('rounds');
  document.getElementById('list').hidden = true; document.getElementById('page').hidden = true; R.hidden = false;
  window.scrollTo(0, 0);
  if (!RV) R.innerHTML = '<p class="mut">Đang tải…</p>';
  return call('rounds', {}).then(function (v) { RV = v; renderRounds(); });
}
function renderRounds() {
  var R = document.getElementById('rounds'), v = RV, today = new Date().toISOString().slice(0, 10);
  var probs = (ALL || []).filter(function (p) { return p.ma_bai.indexOf('THU-') !== 0 || (ME && ME.roles.indexOf('Quản trị') >= 0); });
  var h = '<p><a href="#" id="r-back">← Danh sách</a></p><h2 class="pg">Kỳ phản biện</h2>' +
    '<p class="mut sm-t">Nhắc hạn tự động ' + esc((v.reminderDays || []).join(' và ')) + ' ngày trước hạn (cho người đã được mời, chưa đánh dấu xong).</p>';
  if (v.manage) h += '<div class="card"><h3>Mở kỳ mới</h3><div class="row"><label>Tên kỳ <input id="r-ky" placeholder="ví dụ: PB-10/2026"></label>' +
    '<label>Hạn <input id="r-han" type="date" min="' + today + '"></label><label>Ghi chú <input id="r-gc"></label>' +
    '<button class="pri" data-r="open">Mở kỳ</button></div></div>';
  var rounds = v.rounds.slice().sort(function (a, b) { return (a.trang_thai === 'mở' ? 0 : 1) - (b.trang_thai === 'mở' ? 0 : 1); });
  if (!rounds.length) h += '<p class="mut">Chưa có kỳ nào.</p>';
  rounds.forEach(function (r) {
    var as = r.assignments, open = r.trang_thai === 'mở', man = v.manage && open;
    var done = as.filter(function (a) { return a.xong; }).length, ph = as.filter(function (a) { return a.phieu; }).length;
    var notInvited = {}; as.forEach(function (a) { if (!a.moi_luc) notInvited[a.email] = 1; });
    var nInv = Object.keys(notInvited).length;
    h += '<div class="card rd" data-ky="' + escA(r.ky) + '"><div class="head"><b class="code">' + esc(r.ky) + '</b>' + chip(r.trang_thai) +
      '<span>' + (r.han_phan_bien ? 'hạn ' + esc(vnDate(r.han_phan_bien)) : 'chưa có hạn') + '</span><span class="mut">· ' + as.length + ' phân công · ' + ph + ' phiếu · ' + done + ' xong</span>' +
      (r.ghi_chu ? '<span class="mut">· ' + esc(r.ghi_chu) + '</span>' : '') + '</div>';
    if (man) h += '<div class="row"><label>Đổi hạn <input type="date" data-k="han" value="' + escA(r.han_phan_bien) + '" min="' + today + '"></label>' +
      '<button class="sm" data-r="deadline">Lưu hạn</button>' +
      '<button class="sm" data-r="invite"' + (nInv ? '' : ' disabled') + '>Gửi thư mời (' + nInv + ' người chưa mời)</button>' +
      '<button class="sm" data-r="close">Đóng kỳ…</button><span class="st mut"></span></div>';
    var byP = {}; as.forEach(function (a) { (byP[a.ma_bai] = byP[a.ma_bai] || []).push(a); });
    var codes = Object.keys(byP).sort();
    h += codes.length ? '<div class="tbl-wrap"><table class="as"><tr><th>Bài</th><th>Phản biện</th><th>Mời</th><th>Phiếu</th><th>Xong</th><th>Đã nhắc</th>' + (man ? '<th></th>' : '') + '</tr>' +
      codes.map(function (c) {
        return byP[c].map(function (a, i) {
          return '<tr>' + (i ? '<td></td>' : '<td rowspan="1"><a href="#" data-open="' + escA(c) + '" class="code">' + esc(c) + '</a></td>') +
            '<td>' + esc(a.email) + '</td><td>' + (a.moi_luc ? '✓' : '–') + '</td><td>' + (a.phieu ? '✓' : '–') + '</td><td>' + (a.xong ? '✓' : '–') + '</td>' +
            '<td>' + esc(a.nhac ? a.nhac.split(',').map(function (x) { return x + ' ngày'; }).join(', ') : '') + '</td>' +
            (man ? '<td><button class="sm" data-r="unassign" data-ma="' + escA(c) + '" data-email="' + escA(a.email) + '" title="Bỏ giao">×</button></td>' : '') + '</tr>';
        }).join('');
      }).join('') + '</table></div>' : '<p class="mut">Chưa giao bài nào.</p>';
    if (man) h += '<div class="row"><label>Giao bài <select data-k="ma"><option value="">— chọn bài —</option>' + probs.map(function (p) {
        return '<option value="' + escA(p.ma_bai) + '">' + esc(p.ma_bai + ' · ' + [p.chu_de, p.muc, p.trang_thai].filter(Boolean).join(' · ')) + '</option>'; }).join('') + '</select></label>' +
      '<label>cho <select data-k="pb"><option value="">— chọn phản biện —</option>' + v.reviewers.map(function (u) {
        return '<option value="' + escA(u.email) + '">' + esc(u.email + (u.ten ? ' (' + u.ten + ')' : '')) + '</option>'; }).join('') + '</select></label>' +

    h += '</div>';
  });

  document.getElementById('r-back').onclick = function (e) { e.preventDefault(); nav({}); showList(); };
  R.onclick = function (ev) {
    var o = ev.target.closest('[data-open]');
    if (o) { ev.preventDefault(); nav({ ma: o.getAttribute('data-open') }); openProblem(o.getAttribute('data-open')); return; }
    var b = ev.target.closest('[data-r]'); if (!b || b.disabled) return;
    var card = b.closest('.rd'), ky = card && card.getAttribute('data-ky'), st = card && card.querySelector('.st');
    var a = b.getAttribute('data-r'), q = function (k) { return card.querySelector('[data-k="' + k + '"]').value; };
    var run = function (p, msg) {
      b.disabled = true;
      p.then(function (res) { return openRounds().then(function () {
        if (msg) alertOk(typeof msg === 'function' ? msg(res) : msg);
        if (a === 'unassign' || a === 'assign') loadListQuiet();
      }); }, function () { b.disabled = false; });
    };
    if (a === 'open') {
      var ky0 = document.getElementById('r-ky').value.trim(), han0 = document.getElementById('r-han').value;
      if (!ky0 || !han0) { alertBox('Cần tên kỳ và hạn.'); return; }
      run(call('openRound', { ky: ky0, han_phan_bien: han0, ghi_chu: document.getElementById('r-gc').value }), 'Đã mở kỳ ' + ky0 + '.');
    } else if (a === 'deadline') run(call('setDeadline', { ky: ky, han_phan_bien: q('han') }), 'Đã đổi hạn.');
    else if (a === 'invite') run(call('sendInvites', { ky: ky }), function (r) { return 'Đã gửi ' + r.sent + ' thư mời.'; });
    else if (a === 'assign') {
      if (!q('ma') || !q('pb')) { alertBox('Chọn bài và phản biện.'); return; }
      run(call('assign', { ky: ky, ma_bai: q('ma'), email: q('pb') }));
    } else if (a === 'unassign') run(call('unassign', { ky: ky, ma_bai: b.getAttribute('data-ma'), email: b.getAttribute('data-email') }));
    else if (a === 'close') {
      if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Bấm lần nữa để đóng kỳ ' + ky; return; }
      run(call('closeRound', { ky: ky }), 'Đã đóng kỳ ' + ky + '. Phản biện không còn thấy các bài của kỳ này.');
    }
  };
}
function alertOk(msg) { var d = document.createElement('div'); d.className = 'err ok'; d.textContent = msg; document.body.prepend(d); setTimeout(function () { d.remove(); }, 5000); }
/** Tải lại danh sách ở nền (không đổi màn hình): sau khi giao / bỏ giao, chấm và quyền xem có thể đổi. */
function loadListQuiet() {
  call('bundle', {}).then(function (b) {
    ALL = (b && b.rows) || []; LROWS = {}; ALL.forEach(function (p) { LROWS[p.ma_bai] = p; });
    PCACHE = (b && b.details) || {};
    if (!document.getElementById('list').hidden) renderList();
  });
}

/* ---------- Lịch sử sửa (tab Revisions) ---------- */
function loadHistory(ma) {
  var H = document.getElementById('hist'); H.innerHTML = '<p class="mut">Đang tải…</p>';
  call('revisions', { ma_bai: ma }).then(function (rs) {
    if (!rs || !rs.length) { H.innerHTML = '<p class="mut">Chưa có lần sửa nào qua hệ thống.</p>'; return; }
    H.innerHTML = rs.map(function (r) {
      return '<details class="rev"><summary>Phiên bản ' + esc(r.phien_ban) + ' · ' + esc(FIELD_NAME[r.truong] || r.truong) + ' · ' + esc(r.email) + ' · ' + esc(r.ngay) + '</summary>' +
        diffHtml(r.cu == null ? '' : String(r.cu), r.moi == null ? '' : String(r.moi)) + '</details>';
    }).join('');
  }, function () { H.innerHTML = '<button class="sm" id="hist-load">Xem lịch sử</button>'; document.getElementById('hist-load').onclick = function () { loadHistory(ma); }; });
}

/** So sánh hai bản theo từ (mã LaTeX, không hiển thị công thức): phần bỏ gạch đỏ, phần thêm tô xanh. */
function diffHtml(a, b) {
  var tok = function (s) { return s.match(/\s+|[^\s]+/g) || []; };
  var x = tok(a), y = tok(b), n = x.length, m = y.length;
  if (a === b) return '<p class="mut">(không khác)</p>';
  if (n * m > 4000000) return '<div class="diff"><p class="mut">Văn bản dài — hiện hai bản:</p><del>' + esc(a) + '</del><br><ins>' + esc(b) + '</ins></div>';
  var L = [], i, j;
  for (i = 0; i <= n; i++) L.push(new Uint32Array(m + 1));
  for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  var out = [], push = function (k, t) { var l = out[out.length - 1]; if (l && l.k === k) l.t += t; else out.push({ k: k, t: t }); };
  i = 0; j = 0;
  while (i < n && j < m) {
    if (x[i] === y[j]) { push('=', x[i]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) push('-', x[i++]);
    else push('+', y[j++]);
  }
  while (i < n) push('-', x[i++]);
  while (j < m) push('+', y[j++]);
  return '<div class="diff">' + out.map(function (o) {
    return o.k === '=' ? esc(o.t) : o.k === '-' ? '<del>' + esc(o.t) + '</del>' : '<ins>' + esc(o.t) + '</ins>';
  }).join('') + '</div>';
}
</script>
