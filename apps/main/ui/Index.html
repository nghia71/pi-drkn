function decorate(root) {
  root.querySelectorAll('button:not(.tab)').forEach(function (b) {
    // "+ Thêm …": dấu + trong chữ thay bằng biểu tượng
    var tn = Array.prototype.filter.call(b.childNodes, function (n) { return n.nodeType === 3 && n.nodeValue.trim(); })[0];
    if (tn && /^\s*\+\s*/.test(tn.nodeValue)) tn.nodeValue = tn.nodeValue.replace(/^\s*\+\s*/, '');
    var t = (b.textContent || '').trim(), has = b.querySelector('.ic');
    b.classList.toggle('armed', /^Bấm lần nữa/.test(t));
    if (DANGER.test(t)) b.classList.add('danger');
    if (/^[↑↓×]$/.test(t)) { if (!b.getAttribute('aria-label')) b.setAttribute('aria-label', b.title || t); return; }
    var want = null; BTN_ICON.some(function (m) { if (m[0].test(t)) { want = m[1]; return true; } return false; });
    if (has && has.getAttribute('data-n') === want) return;
    if (has) has.remove();
    if (want) b.insertAdjacentHTML('afterbegin', ic(want).replace('<svg ', '<svg data-n="' + want + '" '));
  });
  root.querySelectorAll('h3').forEach(function (h) {
    if (h.querySelector(':scope > .ic')) return;
    var t = (h.textContent || '').trim(), want = null;
    H3_ICON.some(function (m) { if (m[0].test(t)) { want = m[1]; return true; } return false; });
    if (want) h.insertAdjacentHTML('afterbegin', ic(want));
  });
  root.querySelectorAll('.chip.w:not([data-i])').forEach(function (c) { c.setAttribute('data-i', 1); c.insertAdjacentHTML('afterbegin', ic('triangle-alert')); });
}

                                                      function () { b.disabled = false; stl.textContent = ''; });
    };
    if (a === 'rv-save') {
      var rec = box.querySelector('input[type=radio]:checked');
      if (!rec) { stl.textContent = 'Hãy chọn đề nghị.'; return; }
      go(call('submitReview', { ky: ky, ma_bai: ma, muc_de_nghi: box.querySelector('select').value, diem: rec.value, nhan_xet: box.querySelector('textarea').value }), 'Đã lưu phiếu.');

  } else if (a === 'confl-new') {

      return done(call('addConflict', { ma_bai: ma, loai: v.loai, mo_ta: v.mo_ta }));

  } else if (a === 'confl-edit') {
    var c = d.conflicts.filter(function (x) { return x.id === id; })[0] || {};
    var tbtOnly = b.getAttribute('data-tbt') === '1' && !(d.can && d.can.tbt);

    inlineForm(id, [{ k: 'trang_thai', label: 'Trạng thái', type: 'select', opts: sts, val: tbtOnly ? 'chờ TBT' : 'đã giải quyết' },
                    { k: 'cach_giai_quyet', label: tbtOnly ? 'Ghi chú cho TBT (không bắt buộc)' : 'Cách giải quyết', type: 'area', val: c.cach_giai_quyet }],
      'Lưu', function (v) { return done(call('resolveConflict', { id: id, trang_thai: v.trang_thai, cach_giai_quyet: v.cach_giai_quyet })); });
  }
}

/* ---------- Sửa đề / lời giải (NCB, PT, Quản trị) ----------
 * Khoá lạc quan: gửi kèm phiên bản đang xem; nếu người khác vừa lưu, máy chủ từ chối, bản đang gõ vẫn giữ trong ô,
 * bản mới nhất hiện bên dưới để người sửa tự gộp rồi lưu lại. Không bao giờ ghi đè lặng lẽ. */
var EDITORS = {};
var FIELD_NAME = { de_bai: 'đề bài', loi_giai: 'lời giải', hinh: 'hình' };
var FIELD_TITLE = { de_bai: 'Đề bài', loi_giai: 'Lời giải', hinh: 'Hình' };
/** Hình đã dựng (SVG) và ảnh của bài, máy chủ gửi kèm khi mở bài. */
function figOpts(d) { return d && d.hinh ? { figs: d.hinh.figs || {}, pics: d.hinh.pics || {} } : {}; }
/** Cột Hình: mã TikZ (hiện SVG đã dựng) hoặc tên tệp ảnh, mỗi dòng một tên. */
function hinhHtml(d, src) {
  var t = String(src != null ? src : d.problem.hinh || '').trim(), o = figOpts(d);
  if (!t) return '<p class="mut">(không có hình)</p>';
  if (t.indexOf('\\begin{tikzpicture}') >= 0) return '<div class="tx figs">' + PiRender.render(t, o).html + '</div>';
  return '<div class="tx figs">' + t.split('\n').map(function (n) { n = n.trim(); return n ? PiRender.render('\\includegraphics{' + n + '}', o).html : ''; }).join('') +
    (d.hinh && d.hinh.thieu && d.hinh.thieu.length ? '<p class="w">Không có trong thư mục hình: ' + esc(d.hinh.thieu.join(', ')) + '</p>' : '') + '</div>';
}
function dirtyEdit() { return Object.keys(EDITORS).some(function (f) { var e = EDITORS[f]; return e && e.ta.value !== e.orig; }); }
function busyTyping() {
  var c = document.getElementById('cm-new');
  return Object.keys(EDITORS).length > 0 || !!(c && c.value.trim()) || !!document.querySelector('.inl textarea, .inl input') ||
    Array.prototype.some.call(document.querySelectorAll('.rv textarea'), function (t) { return t.value !== t.defaultValue; });

      : '(LaTeX sạch — ghi chú, lý do sửa ghi ở mục Sửa đổi / Cần kiểm tra, không ghi vào văn bản)') + '</span></h3>' +

  var timer = null, draw = function () {

/** Đóng một ô sửa: vẽ lại riêng phần đó (ô sửa kia, nếu đang mở, giữ nguyên) và dòng phiên bản. */

    var pos = Number(b.getAttribute('data-pos'));
    var run = function (p, msg) { b.disabled = true; p.then(function () { return reload(msg); }, function () { b.disabled = false; }); };
    var armed = function (text) { if (b.dataset.armed) return true; b.dataset.armed = 1; b.textContent = text; return false; };
    if (a === 'new') {
      var so0 = document.getElementById('b-so').value.trim(); if (!so0) { alertBox('Nhập số báo, ví dụ 10/2026.'); return; }
      run(call('newBoard', { so: so0 }), 'Đã lập bảng cho số ' + so0 + '.');
    } else if (a === 'up' || a === 'down') run(call('swap', { so: so, a: pos, b: a === 'up' ? pos - 1 : pos + 1 }));
    else if (a === 'remove') run(call('unplace', { so: so, vi_tri: pos }));
    else if (a === 'submit') run(call('submitBoard', { so: so }), 'Đã gửi TBT duyệt bảng số ' + so + '.');
    else if (a === 'approve') {
      var w = Number(b.getAttribute('data-warn'));
      if (!armed('Bấm lần nữa để duyệt' + (w ? ' (' + w + ' bài còn lưu ý)' : ''))) return;
      run(call('approveBoard', { so: so }), 'Đã duyệt bảng số ' + so + ': các bài được chọn chuyển SL-OK.');
    } else if (a === 'return') {
      inlineForm('ret-' + so, [{ k: 'ghi_chu', label: 'Lý do trả lại (PT sẽ thấy)', type: 'area' }], 'Trả lại', function (v2) {
        return call('returnBoard', { so: so, ghi_chu: v2.ghi_chu }).then(function () { return reload('Đã trả lại bảng số ' + so + '.'); });
      });
    } else if (a === 'close') {
      var kk = card.querySelector('.kk');
      if (kk.innerHTML) { kk.innerHTML = ''; return; }
      closePanel(kk, so, '', reload);
    } else if (a === 'tex') {
      run(call('exportOf', { so: so }).then(function (r) { saveTex(so, r.tex); }));
    } else if (a === 'reopen') {
      if (!armed(b.getAttribute('data-ok') === '1' ? 'Bấm lần nữa: huỷ duyệt, các bài trở về trạng thái trước khi duyệt' : 'Bấm lần nữa để mở lại')) return;
      run(call('reopenBoard', { so: so }), 'Đã mở lại bảng số ' + so + '.');
    }
  };
}

/* ---------- Ảnh: đọc tệp, chọn chỗ đặt (đề / lời giải) ---------- */
function readB64(f) {
  return new Promise(function (ok, bad) {
    var rd = new FileReader();
    rd.onload = function () { ok({ name: f.name, b64: String(rd.result).replace(/^data:[^,]*,/, '') }); };
    rd.onerror = function () { bad(rd.error); };
    rd.readAsDataURL(f);
  });
}
/** Hàng chọn chỗ đặt cho từng ảnh đã chọn. Ảnh của đề được IN kèm đề khi khoá kỳ — ảnh lộ đáp án phải đặt ở lời giải. */
function picRows(files) {
  return Array.prototype.map.call(files, function (f, i) {
    return '<div class="row sm-t"><span class="code">' + esc(f.name) + '</span> <select data-noi="' + i + '"><option value="">— đặt ở đâu? —</option>' +
      '<option value="de">hình của đề (in kèm đề)</option><option value="lg">minh hoạ lời giải (không in)</option></select></div>';
  }).join('');
}
function picFiles(box, input) {
  var fl = Array.prototype.slice.call(input.files || []), out = [];
  for (var i = 0; i < fl.length; i++) {
    var noi = box.querySelector('[data-noi="' + i + '"]').value;
    if (!noi) return { err: 'Chọn chỗ đặt cho ảnh ' + fl[i].name + '.' };
    out.push({ f: fl[i], noi: noi });
  }
  return { list: out };
}
/** Thêm ảnh cho bài đang xem (NCB, PT, Quản trị). */
function picForm(ma) {
  var box = inlBox('pic'); if (!box) return;

  box.innerHTML = '<p class="sm-t">Ảnh SVG, PNG, JPG hoặc PDF (tối đa 3 MB). Hình vẽ bằng GeoGebra/Inkscape: xuất SVG (hoặc PNG); ảnh minh hoạ: JPG/PNG. ' +
    'PDF không hiện trên trang, chỉ dùng khi in.</p><input type="file" multiple accept=".svg,.png,.jpg,.jpeg,.pdf" data-k="f"><div data-k="rows"></div>' +
    '<button class="pri sm" data-k="ok">Tải lên</button> <button class="sm" data-k="no">Huỷ</button>';
  var inp = box.querySelector('[data-k=f]');

  box.querySelector('[data-k=no]').onclick = function () { box.innerHTML = ''; };

      .then(function (res) { box.innerHTML = ''; alertOk('Đã thêm ' + res.names.length + ' ảnh: ' + res.names.join(', ')); return refresh(ma); },
            function () { ok.disabled = false; });

var TOPIC_OF_FILE = { sh: 'SH', ds: 'ĐS', hh: 'HH', th: 'TH' };
/** Tệp .tex của tác giả → đề, lời giải: bỏ dòng tiêu đề "Bài toán …" ở đầu, tách tại "Lời giải", bỏ \medskip thừa. */
function splitTex(t) {
  t = String(t).normalize('NFC').replace(/\r\n?/g, '\n').trim();
  t = t.replace(/^\\textbf\{\s*Bài toán[^{}]*\}\s*\n/, '');
  var m = t.match(/\n\s*(?:\\medskip\s*\n\s*)?\\textbf\{\s*Lời giải\.?\s*\}\s*\n|\n\s*Lời giải\s*[.:]\s*\n/);
  var de = m ? t.slice(0, m.index) : t, lg = m ? t.slice(m.index + m[0].length) : '';
  return { de: de.replace(/\s*\\medskip\s*$/, '').trim(), lg: lg.trim() };
}

    }
    if (k === 'src' || k === 'all') {
      b.disabled = true;
      call('figureSources', { tat_ca: k === 'all' }).then(function (r) {
        b.disabled = false;
        if (!r.n) { alertBox('Không có hình nào để tải.'); return; }
        saveB64(r.ten, r.b64, 'application/zip'); alertOk('Đã tải mã nguồn ' + r.n + ' hình.');
      }, function () { b.disabled = false; });
    } else if (k === 'up') {
      var inp = document.getElementById('f-up'), fl = Array.prototype.slice.call(inp.files || []);
      if (!fl.length) { alertBox('Chọn tệp hinh-svg.zip (hoặc các tệp tikz-….svg) trước.'); return; }
      b.disabled = true;
      Promise.all(fl.map(function (f) {
        return new Promise(function (ok, bad) {
          var rd = new FileReader();
          rd.onload = function () { ok({ name: f.name, b64: String(rd.result).replace(/^data:[^,]*,/, '') }); };
          rd.onerror = function () { bad(rd.error); };
          rd.readAsDataURL(f);
        });
      })).then(function (files) { return call('uploadFigures', { files: files }); }).then(function (r) {
        b.disabled = false; inp.value = '';
        document.getElementById('f-res').innerHTML = '<p class="sm-t">Đã lưu ' + r.saved.length + ' hình.</p>' + (r.skipped.length
          ? '<div class="conf">Không nhận:<ul>' + r.skipped.map(function (x) { return '<li><span class="code">' + esc(x.ten) + '</span>: ' + esc(x.ly_do) + '</li>'; }).join('') + '</ul></div>' : '');
        PCACHE = {};
        return call('figures', {}).then(function (v) { FV = v; var keep = document.getElementById('f-res').innerHTML; renderFigs(); document.getElementById('f-res').innerHTML = keep; });
      }, function () { b.disabled = false; });
    }
  };
}

/* ---------- Khoá kỳ: số in, tệp .tex chỉ có đề bài ---------- */
var TOPIC_NAME = { SH: 'Số học', 'ĐS': 'Đại số', HH: 'Hình học', TH: 'Tổ hợp' };
function saveTex(so, tex) {
  try {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([tex], { type: 'text/x-tex;charset=utf-8' }));
    a.download = 'de-ra-ky-nay-' + String(so).replace(/[^\w.-]+/g, '-') + '.tex';
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { alertBox('Trình duyệt không cho tải tệp — mở mục "Nội dung tệp .tex" để chép.'); }
}
/** Bảng khoá kỳ ngay dưới bảng chọn bài đã duyệt: xem trước (không ghi gì), rồi khoá (bấm hai lần). */
function closePanel(box, so, start, reload) {
  box.innerHTML = '<p class="mut">Đang chuẩn bị…</p>';
  call('closePreview', { so: so, bat_dau: start }).then(function (v) {
    var n = v.items.length, first = v.bat_dau, last = first ? first + n - 1 : 0;
    var h = '<h3>Khoá kỳ — Pi ' + esc(so) + '</h3>' +
      '<p class="row"><label>Số in bắt đầu <input data-k="start" size="8" value="' + escA(first || '') + '" placeholder="ví dụ 1041"></label> ' +
      '<button class="sm" data-k="redo">Đánh lại số</button> <span class="mut sm-t">' +
      (v.goi_y ? 'Gợi ý P' + v.goi_y + ' = số lớn nhất đã in + 1.' : 'Chưa có số in nào trong hệ thống — gõ số của bài đầu tiên.') + '</span></p>' +
      '<div class="tbl-wrap"><table class="as"><tr><th>Số in</th><th>Bài</th><th>Mức</th><th>Chủ đề</th><th>Dòng tác giả</th><th>Lưu ý</th></tr>' +
      v.items.map(function (it) {
        return '<tr><td class="code">' + esc(it.so_in || '—') + '</td><td><a href="#" class="code" data-open="' + escA(it.ma_bai) + '">' + esc(it.ma_bai) + '</a></td>' +
          '<td>' + esc(it.muc) + '</td><td>' + esc(TOPIC_NAME[it.chu_de] || it.chu_de) + '</td><td>' + (it.tac_gia ? '<i>' + esc(it.tac_gia) + '</i>' : '<b class="bad">thiếu</b>') + '</td>' +
          '<td class="w">' + esc(it.notes.join('; ')) + '</td></tr>';
      }).join('') + '</table></div>' +
      '<p class="mut sm-t">Thứ tự in: mức B rồi mức A; trong mỗi mức: Số học, Đại số, Hình học, Tổ hợp (cùng chủ đề theo vị trí trên bảng). ' +
      'Tệp .tex chỉ có đề bài và dòng tác giả — không có lời giải, ghi chú hay thông tin liên hệ.</p>';
    if (v.blockers.length) h += '<div class="conf bad">Chưa khoá được:<ul>' + v.blockers.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
    if (v.warnings.length) h += '<div class="conf">Lưu ý (' + v.warnings.length + '):<ul>' + v.warnings.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
      '<label><input type="checkbox" data-k="ack"> Tôi đã xem các lưu ý trên và vẫn khoá kỳ.</label></div>';
    if (v.tex) h += '<details><summary>Nội dung tệp .tex</summary><textarea readonly rows="12" class="texv">' + esc(v.tex) + '</textarea></details>';
    var can = !v.blockers.length && first;
    h += '<div class="edbar">' + (v.tex ? '<button data-k="dl">Tải .tex xem trước</button> ' : '') +
      '<button class="pri" data-k="lock"' + (can ? '' : ' disabled') + '>Khoá kỳ' + (first ? ': P' + first + '–P' + last : '') + '</button> ' +
      '<button data-k="no">Đóng</button></div>';
    box.innerHTML = h;
    var q = function (k) { return box.querySelector('[data-k="' + k + '"]'); };
    q('no').onclick = function () { box.innerHTML = ''; };
    q('redo').onclick = function () { closePanel(box, so, q('start').value.trim(), reload); };
    q('start').onkeydown = function (e) { if (e.key === 'Enter') q('redo').click(); };
    if (q('dl')) q('dl').onclick = function () { saveTex(so, v.tex); };
    var lock = q('lock');
    lock.onclick = function () {
      if (q('start').value.trim() !== String(first)) { alertBox('Số in đã đổi — bấm "Đánh lại số" để xem lại trước khi khoá.'); return; }
      var ack = !!(q('ack') && q('ack').checked);
      if (v.warnings.length && !ack) { alertBox('Đánh dấu "Tôi đã xem các lưu ý" trước khi khoá.'); return; }
      if (!lock.dataset.armed) { lock.dataset.armed = 1; lock.textContent = 'Bấm lần nữa: ghi số in P' + first + '–P' + last + ', chuyển ' + n + ' bài sang PL (không hoàn tác được)'; return; }
      lock.disabled = true;
      call('closeIssue', { so: so, bat_dau: String(first), xac_nhan: ack }).then(function (r) {
        box.innerHTML = '';
        if (r.missing_pics && r.missing_pics.length) alertBox('Không tìm thấy hình trong thư mục hình: ' + r.missing_pics.join(', ') + ' — gói chế bản thiếu các hình này.');
        return reload('Đã khoá kỳ ' + so + ': P' + first + '–P' + last + '. Gói chế bản đã lưu trên Drive.');
      }, function () { lock.disabled = false; });
    };
  }, function () { box.innerHTML = ''; });
}

/* ---------- Lịch sử sửa (tab Revisions) ---------- */
function loadHistory(ma) {
  var H = document.getElementById('hist'); H.innerHTML = '<p class="mut">Đang tải…</p>';
  call('revisions', { ma_bai: ma }).then(function (rs) {
    if (!rs || !rs.length) { H.innerHTML = '<p class="mut">Chưa có lần sửa nào qua hệ thống.</p>'; return; }
    H.innerHTML = rs.map(function (r) {
      return '<details class="rev"><summary>Phiên bản ' + esc(r.phien_ban) + ' · ' + esc(FIELD_NAME[r.truong] || r.truong) + ' · ' + esc(r.email) + ' · ' + esc(vnTime(r.ngay)) + '</summary>' +
        diffHtml(r.cu == null ? '' : String(r.cu), r.moi == null ? '' : String(r.moi)) + '</details>';
    }).join('');
  }, function () { H.innerHTML = '<button class="sm" id="hist-load">Xem lịch sử</button>'; document.getElementById('hist-load').onclick = function () { loadHistory(ma); }; });
}

/** So sánh hai bản theo từ (mã LaTeX, không hiển thị công thức): phần bỏ gạch đỏ, phần thêm tô xanh. */
function diffHtml(a, b) {
  var tok = function (s) { return s.match(/\s+|[^\s]+/g) || []; };
  var x = tok(a), y = tok(b), n = x.length, m = y.length;
  if (a === b) return '<p class="mut">(không khác)</p>';
  if (n * m > 4000000) return '<div class="diff"><p class="mut">Văn bản dài — hiện hai bản:</p><del>' + esc(a) + '</del><br><ins>' + esc(b) + '</ins></div>';
  var L = [], i, j;
  for (i = 0; i <= n; i++) L.push(new Uint32Array(m + 1));
  for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  var out = [], push = function (k, t) { var l = out[out.length - 1]; if (l && l.k === k) l.t += t; else out.push({ k: k, t: t }); };
  i = 0; j = 0;
  while (i < n && j < m) {
    if (x[i] === y[j]) { push('=', x[i]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) push('-', x[i++]);
    else push('+', y[j++]);
  }
  while (i < n) push('-', x[i++]);
  while (j < m) push('+', y[j++]);
  return '<div class="diff">' + out.map(function (o) {
    return o.k === '=' ? esc(o.t) : o.k === '-' ? '<del>' + esc(o.t) + '</del>' : '<ins>' + esc(o.t) + '</ins>';
  }).join('') + '</div>';
}
