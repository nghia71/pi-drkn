<style>
:root{--bg:#fbfaf7;--fg:#1d1d1b;--mut:#6b6a66;--line:#dedbd3;--card:#fff;--acc:#2e6b4f;--warn:#a35a00;--bad:#b3261e;--chip:#eef3ef}
@media (prefers-color-scheme:dark){:root{--bg:#171816;--fg:#e8e6e1;--mut:#a3a19b;--line:#33352f;--card:#1f201d;--acc:#8fcfae;--warn:#f0b35a;--bad:#ff8a80;--chip:#253029}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "Noto Serif","Times New Roman",serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:2}
h1{font:600 18px system-ui,sans-serif;margin:0 0 6px} h3{font:600 14px system-ui,sans-serif;color:var(--mut);margin:16px 0 4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:13px system-ui,sans-serif;color:var(--mut)}
select,textarea,button{font:13px system-ui,sans-serif;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);padding:4px 6px}
textarea{width:100%;box-sizing:border-box;margin-top:8px} button{margin-top:6px;cursor:pointer}
main{max-width:920px;margin:0 auto;padding:12px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0}
.head{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font:13px system-ui,sans-serif}
.code{font:600 15px ui-monospace,Menlo,monospace;color:var(--acc);text-decoration:none}
.chip{background:var(--chip);border-radius:20px;padding:1px 8px} .chip.w,.w{color:var(--warn)}
.au{color:var(--mut);font-style:italic;margin-left:auto} .mut{color:var(--mut)}
.c{text-align:center}.r{text-align:right} .dm{display:block;overflow-x:auto;overflow-y:hidden}
.fig{display:inline-block;border:1px dashed var(--line);color:var(--mut);font:13px system-ui,sans-serif;padding:6px 10px}
code.unk{color:var(--bad)} .props{font:13px/1.45 system-ui,sans-serif} .props h4{margin:8px 0 2px;font-size:12px;color:var(--mut);text-transform:uppercase}
.cm{border-top:1px solid var(--line);padding:6px 0} .err{position:fixed;top:8px;right:8px;background:var(--bad);color:#fff;padding:8px 12px;border-radius:6px;font:13px system-ui;z-index:9}
details summary{cursor:pointer;font:13px system-ui,sans-serif;color:var(--acc);margin-top:12px}
button.sm{font-size:12px;padding:1px 8px;margin:0 0 0 6px;vertical-align:1px} button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:disabled{opacity:.6;cursor:default} .sm-t{font:12px system-ui,sans-serif;margin:4px 0}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media (max-width:720px){.ed{grid-template-columns:1fr}}
.ed textarea.src{font:13px/1.45 ui-monospace,Menlo,"DejaVu Sans Mono",monospace;margin:0;min-height:160px;resize:vertical}
.pv{border:1px dashed var(--line);border-radius:6px;padding:6px 10px;overflow-x:auto;min-height:160px}
.edbar{font:13px system-ui,sans-serif;margin:4px 0 8px} .edbar .st{margin-left:8px}
.conf{border:1px solid var(--warn);border-radius:6px;padding:6px 10px;margin:8px 0;font:13px system-ui,sans-serif}
.diff{font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:4px 0}
.diff del{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)} .diff ins{color:var(--acc);text-decoration:none;background:color-mix(in srgb,var(--acc) 14%,transparent)}
.rev summary{font-size:12px;margin-top:4px} pre{white-space:pre-wrap;font:12px ui-monospace,Menlo,monospace}
</style>
